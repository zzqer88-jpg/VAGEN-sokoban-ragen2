envs:
  - name: SokobanStateModeling
    n_envs: 2000
    data_source: sokoban_state_modeling_validation
    seed: [0, 1999, 1]
    max_turns: 1
    response_length_per_turn: 512
    max_env_response_per_turn: 32
    stop_strings: ["</prediction>"]
    config:
      manifest_path: ${oc.env:SOKOBAN_STATE_VALIDATION_MANIFEST}
      manifest_index_path: ${oc.env:SOKOBAN_STATE_VALIDATION_INDEX}
      reward_profile: ${oc.env:SOKOBAN_STATE_REWARD_PROFILE,dense}
      verify_manifest_rows: true
